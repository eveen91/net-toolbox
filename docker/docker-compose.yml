services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: net-toolbox:local
    container_name: net-toolbox-backend
    environment:
      ROLE: backend
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    dns:
      - ${ROUTER_IP:-192.168.1.1}
    ports:
      - "8000:8000"
    volumes:
      - toolbox-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: net-toolbox:local
    container_name: net-toolbox-frontend
    environment:
      ROLE: frontend
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  toolbox-data:
    name: net-toolbox-data